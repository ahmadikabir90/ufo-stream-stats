name: Decode media
on:
  push:
    paths:
      - "media/*.b64"
      - ".github/workflows/decode-media.yml"
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 media
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in media/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
      - name: Commit MP4s and drop the sidecars
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          git add media/*.mp4
          git rm -f media/*.b64 || true
          if git diff --cached --quiet; then
            echo "no media changes"
          else
            git commit -m "Add decoded TikTok media"
            git push
          fi
